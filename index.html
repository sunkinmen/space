<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>星隕計畫 PROJECT STARFALL — 繁體中文行動優化版</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #03050a;
      --panel: rgba(8, 15, 26, 0.82);
      --border: rgba(44, 232, 255, 0.32);
      --cyan: #2ce8ff;
      --amber: #ffb03a;
      --crimson: #ff3b4e;
      --violet: #b678ff;
      --green: #4effa8;
      --text: #e6f4fa;
      --muted: #86a0b8;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-wrap { position: fixed; inset: 0; z-index: 1; }
    #lock-layer { position: fixed; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
    #damage-flash {
      position: fixed; inset: 0; z-index: 7; pointer-events: none;
      background: radial-gradient(circle, transparent 48%, rgba(255, 42, 68, 0.45) 100%);
      opacity: 0; transition: opacity 0.14s ease-out;
    }
    .hud-layer {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .top-bar {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 6px; flex-wrap: nowrap; width: 100%;
    }
    .panel {
      pointer-events: auto; background: rgba(6, 13, 24, 0.58);
      border: 1px solid rgba(44, 232, 255, 0.24);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      padding: 5px 8px;
      border-radius: 6px;
    }
    .status-panel { width: 158px; flex-shrink: 0; }
    .brand-row { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 3px; }
    .brand-title { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--cyan); white-space: nowrap; }
    .stage-pill { font-size: 8.5px; font-weight: 700; color: var(--amber); border: 1px solid rgba(255,176,58,0.45); padding: 0px 4px; border-radius: 3px; }
    .bar-row { display: flex; align-items: center; gap: 5px; margin-top: 2.5px; font-size: 9px; font-variant-numeric: tabular-nums; }
    .bar-label { width: 24px; color: var(--muted); font-weight: 700; }
    .bar-track { flex: 1; height: 5px; background: rgba(255,255,255,0.10); border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.08s linear; }
    .bar-fill.hull { background: linear-gradient(90deg, #ff4558, #4effa8); }
    .bar-fill.shield { background: linear-gradient(90deg, #1b9cff, #4ef4ff); }
    .bar-fill.heat { background: linear-gradient(90deg, #2ce8ff, #ffb03a, #ff3b4e); }
    .bar-fill.boost { background: linear-gradient(90deg, #2ce8ff, #ffb03a); }
    .bar-val { width: 26px; text-align: right; font-weight: 700; font-size: 8.5px; }

    .mission-panel {
      text-align: center; padding: 4px 10px; min-width: 0; flex: 0 1 250px;
      background: rgba(6, 13, 24, 0.45);
    }
    .sector-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wave-title { font-size: 10px; font-weight: 800; color: var(--amber); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score-num { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; color: #fff; margin-top: 1px; }
    .reward-row { font-size: 8.5px; color: var(--green); margin-top: 1px; white-space: nowrap; }

    .boss-bar-wrap { display: none; margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(255,59,78,0.35); }
    .boss-bar-wrap.active { display: block; }
    .boss-name { font-size: 9.5px; font-weight: 800; color: var(--crimson); }
    .boss-track { width: 100%; height: 6px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,59,78,0.65); margin-top: 2px; overflow: hidden; border-radius: 2px; }
    .boss-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff223a, #ff8c2b); transition: width 0.08s linear; }
    .boss-sub { font-size: 8px; color: #ffba99; margin-top: 2px; }

    .warning-banner {
      position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
      z-index: 20; pointer-events: none; padding: 5px 14px; border-radius: 4px;
      background: rgba(34, 8, 14, 0.84); border: 1px solid var(--crimson);
      color: #ffd8de; font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
      text-align: center; box-shadow: 0 0 18px rgba(255,42,68,0.38);
      opacity: 0; transition: opacity 0.22s; white-space: nowrap;
    }
    .warning-banner.show { opacity: 1; }
    .toast-box {
      position: fixed; top: 54px; right: 10px; z-index: 28; pointer-events: none;
      display: flex; flex-direction: column; gap: 4px;
    }
    .toast {
      background: rgba(10, 26, 36, 0.88); border: 1px solid var(--green); color: #d8ffec;
      font-size: 10px; font-weight: 700; padding: 5px 9px; border-radius: 4px;
    }

    .controls-cluster { display: flex; align-items: center; gap: 4px; flex-shrink: 0; padding: 4px 6px; }
    .hud-btn {
      pointer-events: auto; background: rgba(12, 22, 36, 0.82);
      border: 1px solid rgba(44, 232, 255, 0.32); color: var(--text);
      font-size: 10px; font-weight: 700; padding: 4px 7px; border-radius: 4px;
      cursor: pointer; transition: 0.14s; white-space: nowrap;
    }
    .hud-btn:hover { border-color: var(--cyan); background: rgba(24, 48, 72, 0.92); }
    .hud-btn.active { background: rgba(44, 232, 255, 0.25); border-color: var(--cyan); color: #fff; }
    .hud-btn.amber { border-color: rgba(255,176,58,0.55); color: var(--amber); }
    .hud-btn.crimson { border-color: rgba(255,59,78,0.65); color: #ff9aa6; background: rgba(42, 10, 16, 0.85); }

    .reticle {
      position: fixed; left: 50%; top: 47%; transform: translate(-50%, -50%);
      width: 40px; height: 40px; pointer-events: none; z-index: 5; opacity: 0.62;
    }
    .reticle::before, .reticle::after {
      content: ""; position: absolute; inset: 0; border: 1px solid rgba(44, 232, 255, 0.6); border-radius: 50%;
    }
    .reticle::after { inset: 13px; border-color: rgba(255, 176, 58, 0.8); }

    .lock-box {
      position: absolute; width: 36px; height: 36px; transform: translate(-50%, -50%);
      border: 1.5px solid var(--crimson); box-shadow: 0 0 8px rgba(255, 59, 78, 0.45); pointer-events: none;
    }
    .lock-box.wp { width: 26px; height: 26px; border-color: #ff9c2b; border-radius: 50%; box-shadow: 0 0 12px rgba(255, 140, 43, 0.8); }
    .lock-box.stunned { border-color: var(--cyan); box-shadow: 0 0 12px rgba(44, 232, 255, 0.8); }
    .lock-hp { position: absolute; top: -6px; left: 0; right: 0; height: 3px; background: rgba(0,0,0,0.65); }
    .lock-hp-fill { height: 100%; background: var(--crimson); }
    .lock-tag { position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 800; color: var(--amber); white-space: nowrap; }
    .crit-pop { position: absolute; transform: translate(-50%, -50%); font-size: 11px; font-weight: 800; pointer-events: none; text-shadow: 0 0 8px rgba(0,0,0,0.95); }

    .bottom-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; width: 100%; }
    .joy-zone {
      pointer-events: auto; width: 92px; height: 92px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid rgba(44, 232, 255, 0.35);
      background: radial-gradient(circle, rgba(44, 232, 255, 0.10) 0%, rgba(5, 12, 22, 0.42) 75%);
      position: relative; display: flex; align-items: center; justify-content: center; touch-action: none;
    }
    .joy-knob {
      width: 34px; height: 34px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #8ef6ff, #1ca6c7);
      border: 2px solid rgba(255,255,255,0.75); box-shadow: 0 0 14px rgba(44,232,255,0.45); pointer-events: none;
    }
    .joy-label { position: absolute; bottom: 7px; font-size: 8px; letter-spacing: 0.1em; color: rgba(185,230,248,0.65); pointer-events: none; }

    .arsenal-dock {
      pointer-events: auto; display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 3px; flex-wrap: nowrap; overflow-x: auto; max-width: calc(100vw - 320px);
      padding: 3px 5px; background: rgba(6, 13, 24, 0.50); border: 1px solid rgba(44,232,255,0.2); border-radius: 6px;
      scrollbar-width: none;
    }
    .arsenal-dock::-webkit-scrollbar { display: none; }
    .weapon-strip { display: flex; gap: 3px; flex-wrap: nowrap; align-items: center; }
    .strip-sep { width: 1px; height: 18px; background: rgba(44,232,255,0.28); margin: 0 2px; flex-shrink: 0; }
    .w-slot {
      background: rgba(10, 18, 30, 0.78); border: 1px solid rgba(44, 232, 255, 0.25);
      color: var(--text); font-size: 9px; font-weight: 700;
      padding: 4px 6px; cursor: pointer; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
    }
    .w-slot.active { background: rgba(44, 232, 255, 0.28); border-color: var(--cyan); color: #fff; }
    .w-slot.special { border-color: rgba(255, 176, 58, 0.40); color: #ffd999; }
    .w-slot.ult { border-color: rgba(182, 120, 255, 0.55); color: #dfc2ff; }
    .w-slot.ult.ready { background: rgba(182, 120, 255, 0.38); border-color: #d6a4ff; color: #fff; box-shadow: 0 0 12px rgba(182,120,255,0.55); }
    .w-slot:disabled { opacity: 0.42; cursor: not-allowed; }

    .action-pad { display: flex; align-items: flex-end; gap: 6px; pointer-events: auto; flex-shrink: 0; }
    .tactile-btn {
      width: 56px; height: 56px; border-radius: 50%;
      border: 1.5px solid rgba(44, 232, 255, 0.6);
      background: radial-gradient(circle, rgba(44, 232, 255, 0.18), rgba(6, 14, 26, 0.72));
      color: #e9fbff; font-size: 10px; font-weight: 800;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .tactile-btn.engaged, .tactile-btn:active { transform: scale(0.92); background: radial-gradient(circle, rgba(44,232,255,0.52), rgba(10,32,54,0.92)); }
    .tactile-btn.fire-btn { width: 66px; height: 66px; border-color: var(--cyan); font-size: 11px; }
    .tactile-btn.boost-btn { border-color: var(--amber); color: #ffe2b3; background: radial-gradient(circle, rgba(255,176,58,0.18), rgba(22,14,8,0.72)); }

    /* Campaign / Hangar / Achievements Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 35; background: rgba(3, 6, 12, 0.86);
      display: none; align-items: center; justify-content: center; pointer-events: auto; padding: 14px;
    }
    .modal-overlay.open { display: flex; }
    .hub-card { width: min(760px, 100%); max-height: 90vh; overflow-y: auto; padding: 18px 20px; }
    .hub-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid rgba(44,232,255,0.25); padding-bottom: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .hub-tabs { display: flex; gap: 6px; }
    .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
    .card-item {
      background: rgba(12, 22, 36, 0.82); border: 1px solid rgba(44, 232, 255, 0.25);
      padding: 11px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    }
    .card-item.locked { opacity: 0.48; }
    .card-item.active-sec { border-color: var(--amber); box-shadow: 0 0 14px rgba(255,176,58,0.2); }
    .card-title { font-size: 12px; font-weight: 800; color: var(--cyan); letter-spacing: 0.08em; }
    .card-sub { font-size: 10.5px; color: var(--muted); line-height: 1.4; }
    .card-meta { font-size: 10px; color: var(--amber); font-weight: 700; }

    @media (max-height: 460px), (max-width: 760px) {
      .status-panel { width: 138px; padding: 4px 6px; }
      .mission-panel { padding: 3px 8px; }
      .joy-zone { width: 78px; height: 78px; }
      .joy-knob { width: 28px; height: 28px; }
      .tactile-btn { width: 48px; height: 48px; font-size: 9px; }
      .tactile-btn.fire-btn { width: 58px; height: 58px; font-size: 10px; }
      .arsenal-dock { max-width: calc(100vw - 265px); }
      .w-slot { font-size: 8.5px; padding: 3px 5px; }
    }

    #boost-vignette {
      position: fixed; inset: 0; z-index: 8; pointer-events: none;
      background: radial-gradient(circle, transparent 54%, rgba(44, 232, 255, 0.24) 88%, rgba(255, 176, 58, 0.34) 100%);
      opacity: 0; transition: opacity 0.2s ease-out;
    }
    #warp-overlay {
      position: fixed; inset: 0; z-index: 40; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(44, 232, 255, 0.32) 0%, rgba(8, 16, 36, 0.92) 65%, #02040a 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.38s ease-out;
    }
    #warp-overlay.active { opacity: 1; }
    .warp-title { font-size: 20px; font-weight: 800; letter-spacing: 0.28em; color: #e8fcff; text-shadow: 0 0 24px #2ce8ff; text-transform: uppercase; }
    .warp-sub { font-size: 11px; letter-spacing: 0.22em; color: var(--amber); margin-top: 8px; text-transform: uppercase; }
    #orient-bar {
      display: none; position: fixed; bottom: 132px; left: 50%; transform: translateX(-50%);
      z-index: 29; pointer-events: auto; background: rgba(10, 20, 34, 0.92);
      border: 1px solid var(--amber); color: #ffe3b8; font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; padding: 6px 12px; gap: 10px; align-items: center;
    }
    @media (orientation: portrait) and (max-width: 680px) {
      #orient-bar.show { display: flex; }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="lock-layer"></div>
  <div id="damage-flash"></div>
  <div id="boost-vignette"></div>
  <div id="warp-overlay"><div class="warp-title" id="warp-title">超空間躍遷</div><div class="warp-sub" id="warp-sub">第一星域 // 星雲邊境</div></div>
  <div id="orient-bar" class="show"><span>建議旋轉為橫向螢幕以獲得最佳操控體驗</span><button class="hud-btn amber" id="dismiss-orient" style="padding:2px 6px;">知道了</button></div>
  <div class="reticle" id="reticle"></div>
  <div class="warning-banner" id="warning-banner">警告 // 偵測到大型旗艦訊號</div>
  <div class="toast-box" id="toast-box"></div>

  <div class="hud-layer">
    <div class="top-bar">
      <div class="panel status-panel">
        <div class="brand-row">
          <div class="brand-title">先鋒號 VX-09</div>
          <div class="stage-pill" id="pilot-lv-pill">LV 1</div>
        </div>
        <div class="bar-row"><span class="bar-label">裝甲</span><div class="bar-track"><div class="bar-fill hull" id="hull-fill"></div></div><span class="bar-val" id="hull-val">100</span></div>
        <div class="bar-row"><span class="bar-label">護盾</span><div class="bar-track"><div class="bar-fill shield" id="shield-fill"></div></div><span class="bar-val" id="shield-val">100</span></div>
        <div class="bar-row"><span class="bar-label">過熱</span><div class="bar-track"><div class="bar-fill heat" id="heat-fill" style="width:0%"></div></div><span class="bar-val" id="heat-val">0%</span></div>
        <div class="bar-row"><span class="bar-label">推進</span><div class="bar-track"><div class="bar-fill boost" id="boost-fill"></div></div><span class="bar-val" id="boost-val">100%</span></div>
      </div>

      <div class="panel mission-panel">
        <div class="sector-tag" id="sector-tag">第一星域 // 星雲邊境</div>
        <div class="wave-title" id="wave-title">第 1/5 波 // 艦隊殲滅戰</div>
        <div class="score-num" id="score-val">000,000</div>
        <div class="reward-row" id="reward-row">信用點 600 • 連擊 x1.0</div>
        <div class="boss-bar-wrap" id="boss-bar-wrap">
          <div class="boss-name" id="boss-name">星界利維坦</div>
          <div class="boss-track"><div class="boss-fill" id="boss-fill"></div></div>
          <div class="boss-sub" id="boss-sub">階段 1/3 • 4 座反應爐運作中</div>
        </div>
      </div>

      <div class="panel controls-cluster">
        <button class="hud-btn active" id="open-hub-btn">戰役 / 機庫</button>
        <button class="hud-btn crimson" id="skip-boss-btn">頭目戰</button>
        <button class="hud-btn amber" id="audio-btn">靜音</button>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="joy-zone" id="joy-zone" aria-label="飛行搖桿">
        <div class="joy-knob" id="joy-knob"></div>
        <div class="joy-label">飛行</div>
      </div>

      <div class="arsenal-dock">
        <div class="weapon-strip">
          <button class="w-slot active" data-weapon="PULSE">脈衝</button>
          <button class="w-slot" data-weapon="PLASMA">電漿</button>
          <button class="w-slot" data-weapon="RAILGUN">磁軌</button>
          <button class="w-slot" data-weapon="PHOTON_BEAM">光子</button>
          <button class="w-slot" data-weapon="BURST">連發</button>
        </div>
        <div class="strip-sep"></div>
        <div class="weapon-strip">
          <button class="w-slot special" id="btn-missile">飛彈(<span id="missile-cnt">14</span>)</button>
          <button class="w-slot special" id="btn-multi">齊射</button>
          <button class="w-slot special" id="btn-emp">電磁</button>
          <button class="w-slot special" id="btn-bomb">重力</button>
          <button class="w-slot ult" id="btn-ult">必殺 <span id="ult-pct">0%</span></button>
        </div>
      </div>

      <div class="action-pad">
        <button class="tactile-btn" id="shield-btn">護盾</button>
        <button class="tactile-btn boost-btn" id="boost-btn">加速</button>
        <button class="tactile-btn fire-btn" id="fire-btn">射擊</button>
      </div>
    </div>
  </div>

  <!-- 繁體中文指揮中心（戰役 / 機庫 / 系統設定 / 成就） -->
  <div class="modal-overlay" id="hub-overlay">
    <div class="panel hub-card">
      <div class="hub-header">
        <div>
          <div class="brand-title" style="font-size:14px;">星隕指揮中心</div>
          <div style="font-size:10.5px;color:var(--green);margin-top:2px;" id="hub-wallet">信用點：600 • 飛官等級 LV 1</div>
        </div>
        <div class="hub-tabs">
          <button class="hud-btn active" data-hubtab="campaign">五大星域</button>
          <button class="hud-btn" data-hubtab="hangar">機庫升級</button>
          <button class="hud-btn" data-hubtab="settings">畫質與操控</button>
          <button class="hud-btn" data-hubtab="profile">成就紀錄</button>
          <button class="hud-btn crimson" id="close-hub-btn">返回戰鬥</button>
        </div>
      </div>
      <div id="hub-content"></div>
    </div>
  </div>

  <!-- 任務結算視窗 -->
  <div class="modal-overlay" id="end-overlay">
    <div class="panel" style="text-align:center;padding:22px 28px;max-width:400px;">
      <div class="brand-title" id="end-title" style="font-size:15px;">星域肅清完成</div>
      <div style="font-size:12px;color:var(--muted);margin:10px 0 16px;" id="end-stats">總分 0</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="hud-btn active" id="next-sector-btn" style="padding:8px 14px;">前往下一星域</button>
        <button class="hud-btn amber" id="end-hangar-btn" style="padding:8px 14px;">機庫升級</button>
        <button class="hud-btn" id="restart-btn" style="padding:8px 14px;">重新出擊</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'project_starfall_save_v1';
      const DEFAULT_SAVE = {
        credits: 600, xp: 0, level: 1, unlockedSectors: 1, highScore: 0,
        totalKills: 0, bossesDefeated: 0,
        upgrades: { hull: 1, shield: 1, weapons: 1, thrusters: 1, ordnance: 1 },
        achievements: []
      };

      function loadSave() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SAVE));
          const p = JSON.parse(raw);
          return Object.assign({}, DEFAULT_SAVE, p, { upgrades: Object.assign({}, DEFAULT_SAVE.upgrades, p.upgrades || {}) });
        } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_SAVE)); }
      }
      function persistSave() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData)); } catch (e) {}
      }

      // Procedural 512x512 Aerospace Metallic PBR Suite (Brushed Titanium + Edge Wear + Rivets + Panel Seams)
      function createHullPBR(baseHex, panelHex, stripeHex, emiHex, addWindows) {
        const size = 512;
        const cA = document.createElement('canvas'); cA.width = cA.height = size;
        const cB = document.createElement('canvas'); cB.width = cB.height = size;
        const cR = document.createElement('canvas'); cR.width = cR.height = size;
        const cE = document.createElement('canvas'); cE.width = cE.height = size;
        const a = cA.getContext('2d'), b = cB.getContext('2d'), r = cR.getContext('2d'), e = cE.getContext('2d');

        a.fillStyle = baseHex; a.fillRect(0,0,size,size);
        b.fillStyle = '#808080'; b.fillRect(0,0,size,size);
        r.fillStyle = '#5c5c5c'; r.fillRect(0,0,size,size);
        e.fillStyle = '#000000'; e.fillRect(0,0,size,size);

        // Anisotropic brushed metal grain & micro-scratches
        for (let y = 0; y < size; y += 2) {
          a.fillStyle = (y % 4 === 0) ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.055)';
          a.fillRect(0, y, size, 1);
          r.fillStyle = (y % 4 === 0) ? '#3c3c3c' : '#707070';
          r.fillRect(0, y, size, 1);
        }
        // Machined armor panels, recessed bevel seams, metallic edge-wear & rivets
        for (let i = 0; i < 48; i++) {
          const x = ((i * 73) % 8) * 64, y = ((i * 41) % 8) * 64;
          const w = 64 * (1 + (i % 2)), h = 64 * (1 + ((i >> 1) % 2));
          const grad = a.createLinearGradient(x, y, x + w, y + h);
          grad.addColorStop(0, (i % 3 === 0) ? panelHex : baseHex);
          grad.addColorStop(1, 'rgba(0,0,0,0.22)');
          a.fillStyle = (i % 3 === 0) ? panelHex : baseHex;
          a.fillRect(x+2, y+2, w-4, h-4);
          a.fillStyle = grad;
          a.fillRect(x+2, y+2, w-4, h-4);

          // Dark recessed panel seam + bright chipped metallic edge highlight
          a.strokeStyle = 'rgba(0,0,0,0.75)'; a.lineWidth = 3; a.strokeRect(x+2, y+2, w-4, h-4);
          a.strokeStyle = 'rgba(220,240,255,0.22)'; a.lineWidth = 1.2; a.strokeRect(x+4.5, y+4.5, w-9, h-9);

          // Corner rivets
          a.fillStyle = 'rgba(0,0,0,0.55)';
          b.fillStyle = '#303030';
          [[x+8,y+8],[x+w-10,y+8],[x+8,y+h-10],[x+w-10,y+h-10]].forEach(function (pt) {
            a.fillRect(pt[0], pt[1], 2.5, 2.5);
            b.fillRect(pt[0], pt[1], 3, 3);
          });

          b.fillStyle = (i % 2 === 0) ? '#c2c2c2' : '#6a6a6a'; b.fillRect(x+4, y+4, w-8, h-8);
          b.strokeStyle = '#0e0e0e'; b.lineWidth = 4; b.strokeRect(x+2, y+2, w-4, h-4);
          r.fillStyle = (i % 2 === 0) ? '#323232' : '#7a7a7a'; r.fillRect(x+4, y+4, w-8, h-8);

          if (addWindows && i % 3 === 0) {
            e.fillStyle = emiHex;
            for (let wx = x + 10; wx < x + w - 12; wx += 9) {
              if ((wx + i) % 2 === 0) e.fillRect(wx, y + 14, 4, 2.5);
              if ((wx + i) % 3 === 0) e.fillRect(wx, y + 28, 3.5, 2.5);
            }
          }
        }
        if (stripeHex) {
          a.fillStyle = stripeHex; a.fillRect(0, 230, size, 18);
          e.fillStyle = emiHex; e.fillRect(0, 238, size, 3);
        }
        function toTex(cv) {
          const t = new THREE.CanvasTexture(cv);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          return t;
        }
        return { map: toTex(cA), bumpMap: toTex(cB), roughnessMap: toTex(cR), emissiveMap: toTex(cE) };
      }

      // Weathered Capital Carrier 1024x512 PBR Texture (Rust Patches, Oil Streaks, Hazard Stripes, Hull Serial & Legion Logo)
      function createCarrierHullPBR(hullSerial, legionStyle, baseHex, trimHex, accentHex) {
        const W = 1024, H = 512;
        const cA = document.createElement('canvas'); cA.width = W; cA.height = H;
        const cB = document.createElement('canvas'); cB.width = W; cB.height = H;
        const cR = document.createElement('canvas'); cR.width = W; cR.height = H;
        const cE = document.createElement('canvas'); cE.width = W; cE.height = H;
        const a = cA.getContext('2d'), b = cB.getContext('2d'), r = cR.getContext('2d'), e = cE.getContext('2d');

        a.fillStyle = baseHex; a.fillRect(0, 0, W, H);
        b.fillStyle = '#808080'; b.fillRect(0, 0, W, H);
        r.fillStyle = '#686868'; r.fillRect(0, 0, W, H);
        e.fillStyle = '#000000'; e.fillRect(0, 0, W, H);

        // Armor plating grid + recessed seams + rivets
        for (let gx = 0; gx < 16; gx++) {
          for (let gy = 0; gy < 8; gy++) {
            const x = gx * 64, y = gy * 64;
            const shade = ((gx * 13 + gy * 7) % 3 === 0) ? trimHex : baseHex;
            a.fillStyle = shade; a.fillRect(x + 2, y + 2, 60, 60);
            a.strokeStyle = 'rgba(0,0,0,0.72)'; a.lineWidth = 2.5; a.strokeRect(x + 2, y + 2, 60, 60);
            a.strokeStyle = 'rgba(215,230,245,0.12)'; a.lineWidth = 1; a.strokeRect(x + 4, y + 4, 56, 56);
            b.fillStyle = ((gx + gy) % 2 === 0) ? '#b8b8b8' : '#646464'; b.fillRect(x + 3, y + 3, 58, 58);
            b.strokeStyle = '#121212'; b.lineWidth = 3; b.strokeRect(x + 2, y + 2, 60, 60);
            r.fillStyle = ((gx + gy) % 2 === 0) ? '#444444' : '#8e8e8e'; r.fillRect(x + 3, y + 3, 58, 58);
          }
        }

        // Heavy Rust Patches, Oxidized Streaks & Battle Scorch Marks
        for (let i = 0; i < 65; i++) {
          const rx = (i * 157) % W, ry = (i * 97) % H;
          const rad = 18 + (i % 5) * 14;
          const rg = a.createRadialGradient(rx, ry, 2, rx, ry, rad);
          rg.addColorStop(0, i % 3 === 0 ? 'rgba(138, 62, 26, 0.72)' : 'rgba(92, 42, 20, 0.58)');
          rg.addColorStop(0.6, 'rgba(68, 34, 18, 0.28)');
          rg.addColorStop(1, 'rgba(0,0,0,0)');
          a.fillStyle = rg; a.fillRect(rx - rad, ry - rad, rad * 2, rad * 2);
          r.fillStyle = 'rgba(220,220,220,0.55)'; r.fillRect(rx - rad * 0.5, ry - rad * 0.5, rad, rad);

          // Oil / rust drip streak
          a.fillStyle = 'rgba(42, 22, 12, 0.42)';
          a.fillRect(rx, ry, 3 + (i % 4), 28 + (i % 48));
        }

        // Diagonal Yellow-Black Industrial Hazard Deck Stripe
        a.save();
        a.beginPath(); a.rect(0, 396, W, 28); a.clip();
        a.fillStyle = '#c48a24'; a.fillRect(0, 396, W, 28);
        a.fillStyle = '#191a1d';
        for (let hx = -32; hx < W + 64; hx += 34) {
          a.beginPath(); a.moveTo(hx, 396); a.lineTo(hx + 16, 396); a.lineTo(hx + 2, 424); a.lineTo(hx - 14, 424); a.closePath(); a.fill();
        }
        a.restore();

        // Painted Military Stencil Hull Model Serial (e.g. CVN-07, UNF-42)
        a.save();
        a.font = '900 92px Impact, Arial Black, sans-serif';
        a.fillStyle = 'rgba(225, 232, 238, 0.78)';
        a.fillText(hullSerial, 72, 195);
        a.font = '700 22px monospace';
        a.fillStyle = 'rgba(225, 190, 120, 0.72)';
        a.fillText('HEAVY FLEET CARRIER // SECTOR COMMAND', 76, 232);
        // Subtle paint wear scratches over the stencil
        a.fillStyle = baseHex;
        for (let k = 0; k < 22; k++) {
          a.fillRect(72 + (k * 37) % 340, 118 + (k * 19) % 85, 8 + (k % 12), 2.5);
        }
        a.restore();

        // Original Geometric Fleet Legion Emblem / Logo
        a.save();
        a.translate(770, 178);
        a.strokeStyle = accentHex; a.fillStyle = accentHex; a.lineWidth = 8;
        if (legionStyle === 0) {
          // Vanguard Star-Chevron Crest
          a.beginPath(); a.arc(0, 0, 74, 0, Math.PI * 2); a.stroke();
          a.beginPath(); a.moveTo(0, -56); a.lineTo(44, 32); a.lineTo(0, 10); a.lineTo(-44, 32); a.closePath(); a.fill();
          a.fillStyle = 'rgba(235,245,255,0.85)';
          a.beginPath(); a.arc(0, -14, 12, 0, Math.PI * 2); a.fill();
        } else if (legionStyle === 1) {
          // Iron Bastion Hex-Shield Insignia
          a.beginPath();
          for (let s = 0; s < 6; s++) {
            const ang = (s * Math.PI) / 3 - Math.PI / 6;
            const px = Math.cos(ang) * 74, py = Math.sin(ang) * 74;
            if (s === 0) a.moveTo(px, py); else a.lineTo(px, py);
          }
          a.closePath(); a.stroke();
          a.fillRect(-42, -16, 84, 14); a.fillRect(-26, 8, 52, 14); a.fillRect(-10, 30, 20, 14);

          a.strokeRect(-76, -54, 152, 124);
        }
        a.restore();

        // Illuminated Micro Deck Windows & Hangar Bay Strips
        for (let wy = 276; wy < 366; wy += 16) {
          for (let wx = 44; wx < W - 44; wx += 14) {

        const wpDefs = [

          lockLayer.appendChild(el);

        });

        root.position.set(0, 3.2, -210);

        boss = {
          root: root, emitter: emitter, spinRing: spinRing, wps: wps, coreHex: coreHex,
          hp: sec.bossHp, maxHp: sec.bossHp, phase: 1,
          introTimer: 2.0, fireCd: 1.3, reinforceCd: 8.5,

        };

      function clearBossUI() {

      // Mission State

        hull: 100, maxHull: 100, shield: 100, maxShield: 100, boost: 100, heat: 0, overheated: false,
        weapon: 'PULSE', primaryCd: 0, missileAmmo: 14, empCd: 0, bombCd: 0,

      };

      function startWave(idx) {

        if (idx >= 4) {
          document.getElementById('wave-title').textContent = '第 5/5 波 // 頭目戰：' + sec.boss;

        } else {

          state.waveQueue = WAVE_TEMPLATES[idx].slice();

      function deploySector(sectorIdx) {
        currentSectorIdx = Math.max(0, Math.min(SECTORS.length - 1, sectorIdx));
        const sec = SECTORS[currentSectorIdx], st = getStats();
        enemies.forEach(function (e) { scene.remove(e.mesh); e.el.remove(); }); enemies.length = 0;

      function spawnPickup(pos, cr, xp) {
        const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.68, 0), new THREE.MeshBasicMaterial({ color: 0x4effa8 }));
        m.position.copy(pos); scene.add(m);
        pickups.push({ mesh: m, cr: cr, xp: xp, life: 9.0 });
      }

      function damageEnemy(e, dmg, critChance, shieldMult, isEmp) {
        const st = getStats();
        const crit = Math.random() < (critChance || 0.15);
        let tot = dmg * st.dmgMult * (crit ? 1.65 : 1.0);
        if (e.shield > 0) {
          const sh = Math.min(e.shield, tot * (shieldMult || 1.0));
          e.shield -= sh; tot = Math.max(0, tot - sh / (shieldMult || 1.0));
        }
        e.hp -= tot;
        if (isEmp) e.stunTimer = 3.5;
        if (crit) showPop(e.mesh.position, '暴擊 ' + Math.round(dmg*st.dmgMult*1.65), '#ffb03a');
        state.ult = Math.min(100, state.ult + (e.hp <= 0 ? 10 : 1.4));
        if (e.hp <= 0) {
          spawnExplosion(e.mesh.position, e.type === 'DESTROYER' ? 1.85 : (e.type === 'ELITE' ? 1.5 : 1.0), e.type === 'ELITE' ? 0xff33aa : 0xff8c2b);
          spawnPickup(e.mesh.position, e.spec.cr, e.spec.xp);
          state.combo = Math.min(8.0, +(state.combo + 0.25).toFixed(2)); state.comboTimer = 5.5;
          state.score += Math.round(e.spec.score * state.combo);
          saveData.totalKills++;
          if (state.score > saveData.highScore) saveData.highScore = state.score;
          checkProgression(0);
          scene.remove(e.mesh); e.el.remove();
          return true;
        }
        return false;
      }

      function damageBoss(hitPos, dmg, critChance) {
        if (!boss || boss.dying) return false;
        const st = getStats(), crit = Math.random() < (critChance || 0.15);
        let applied = dmg * st.dmgMult * (crit ? 1.55 : 1.0);
        let hitWP = null;
        for (let i = 0; i < boss.wps.length; i++) {
          const wp = boss.wps[i]; if (wp.destroyed) continue;
          const wPos = new THREE.Vector3(); wp.mesh.getWorldPosition(wPos);
          if (hitPos.distanceTo(wPos) < 5.0) { hitWP = wp; break; }
        }
        if (hitWP) {
          hitWP.hp -= applied * 1.45; boss.hp -= applied * 1.45;
          showPop(hitPos, '弱點暴擊 ' + Math.round(applied*1.45), '#ff9c2b');
          if (hitWP.hp <= 0) {
            hitWP.destroyed = true; hitWP.mesh.material.color.setHex(0x201818); hitWP.el.style.display = 'none';
            const wpPos = new THREE.Vector3(); hitWP.mesh.getWorldPosition(wpPos);
            spawnExplosion(wpPos, 2.5, boss.coreHex);
            boss.hp = Math.max(1, boss.hp - 240);
            state.shake = Math.min(1, state.shake + 0.65); state.score += 1200;
            showBanner('反應爐弱點已摧毀！', 1800); vibrate([60, 25, 85]);
          }
        } else { boss.hp -= applied * 0.72; }
        state.ult = Math.min(100, state.ult + 1.2);
        const ratio = boss.hp / boss.maxHp;
        const newPhase = ratio <= 0.30 ? 3 : (ratio <= 0.65 ? 2 : 1);
        if (newPhase > boss.phase) {
          boss.phase = newPhase;
          showBanner(SECTORS[currentSectorIdx].boss + ' — 進入第 ' + newPhase + ' 階段', 2200);
          spawnShockwave(boss.root.position.clone(), 44, boss.coreHex);
        }
        if (boss.hp <= 0 && !boss.dying) {
          boss.hp = 0; boss.dying = true; boss.deathTimer = 2.4; bossBeamMesh.visible = false;
          showBanner('頭目主反應爐熔毀倒數！', 2200);
        }
        return true;
      }

      function damagePlayer(amount) {
        if (state.gameOver || state.victory) return;
        if (shieldActive && state.shield > 0) {
          state.shield = Math.max(0, state.shield - amount * 0.8);
          shieldUniforms.uImpact.value = 1.0; sfx.tone(420, 210, 0.14, 'sine', 0.08); vibrate([16, 20, 16]); return;
        }
        if (state.shield > 0) {
          const abs = Math.min(state.shield, amount);
          state.shield -= abs; shieldUniforms.uImpact.value = 1.0; amount -= abs;
        }
        if (amount > 0) {
          state.hull = Math.max(0, state.hull - amount);
          state.shake = Math.min(1, state.shake + 0.4);
          damageFlash.style.opacity = '1'; setTimeout(function () { damageFlash.style.opacity = '0'; }, 140);
          sfx.tone(140, 45, 0.22, 'sawtooth', 0.1); vibrate([55, 25, 55]);
          if (state.hull <= 0) {
            state.gameOver = true;
            spawnExplosion(shipGroup.position, 2.0, 0xff3b4e);
            document.getElementById('end-title').textContent = '艦體結構毀損 — 任務失敗';
            document.getElementById('end-title').style.color = '#ff3b4e';
            document.getElementById('end-stats').textContent = '總分 ' + state.score.toLocaleString() + ' • 持有信用點 ' + saveData.credits;
            document.getElementById('next-sector-btn').style.display = 'none';
            document.getElementById('end-overlay').classList.add('open');
          }
        }
      }

      // Weapons Firing
      const boltGeo = new THREE.CylinderGeometry(0.09, 0.09, 2.8, 8); boltGeo.rotateX(Math.PI/2);
      const plasmaGeo = new THREE.SphereGeometry(0.45, 10, 8);
      const railGeo = new THREE.CylinderGeometry(0.14, 0.14, 9.5, 8); railGeo.rotateX(Math.PI/2);

      function firePrimary(dt) {
        if (state.overheated || state.gameOver || state.victory || state.paused) { photonBeamMesh.visible = false; return; }
        const spec = WEAPONS[state.weapon];
        if (state.weapon === 'PHOTON_BEAM') {
          photonBeamMesh.visible = true;
          photonBeamMesh.position.set(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z - 106);
          state.heat = Math.min(100, state.heat + spec.heat * dt);
          if (state.heat >= 100) { state.overheated = true; photonBeamMesh.visible = false; }
          if (state.primaryCd <= 0) {
            state.primaryCd = 0.08; sfx.tone(520, 480, 0.07, 'sine', 0.04);
            for (let i = enemies.length - 1; i >= 0; i--) {
              if (enemies[i].mesh.position.z < shipGroup.position.z && Math.hypot(enemies[i].mesh.position.x - shipGroup.position.x, enemies[i].mesh.position.y - shipGroup.position.y) < enemies[i].spec.r + 1.2) {
                if (damageEnemy(enemies[i], spec.dmg * 0.15, spec.crit, 1.1)) enemies.splice(i, 1);
              }
            }
            if (boss && !boss.dying && Math.hypot(boss.root.position.x - shipGroup.position.x, boss.root.position.y - shipGroup.position.y) < 16) {
              damageBoss(new THREE.Vector3(shipGroup.position.x, shipGroup.position.y, boss.root.position.z + 12), spec.dmg * 0.16, spec.crit);
            }
          }
          return;
        }
        photonBeamMesh.visible = false;
        if (state.primaryCd > 0) return;
        state.primaryCd = spec.cd; state.heat = Math.min(100, state.heat + spec.heat);
        if (state.heat >= 100) state.overheated = true;

        if (state.weapon === 'PULSE') {
          [-2.55, 2.55].forEach(function (xo) {
            const g = new THREE.Group();
            g.add(
              new THREE.Mesh(boltGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending })),
              new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 3.4, 8).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({ color: spec.color, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending }))
            );
            g.position.set(shipGroup.position.x + xo, shipGroup.position.y - 0.18, shipGroup.position.z - 2.3);
            scene.add(g); playerProjs.push({ mesh: g, vz: -spec.speed, vx: 0, dmg: spec.dmg, crit: spec.crit, splash: 0, pierce: false, trailColor: 0x3ef4ff, life: 1.2 });
          });
          flashMuzzle(new THREE.Vector3(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z - 2.5), 0x3ef4ff, 6.5); vibrate(8);
          sfx.tone(680, 160, 0.1, 'triangle', 0.06);
        } else if (state.weapon === 'PLASMA') {
          const g = new THREE.Group();
          g.add(
            new THREE.Mesh(plasmaGeo, new THREE.MeshBasicMaterial({ color: 0xfff3c4, blending: THREE.AdditiveBlending })),
            new THREE.Mesh(new THREE.SphereGeometry(0.92, 12, 10), new THREE.MeshBasicMaterial({ color: 0xff7718, transparent: true, opacity: 0.58, blending: THREE.AdditiveBlending })),
            new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 0), new THREE.MeshBasicMaterial({ color: 0xffb03a, wireframe: true, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending }))
          );
          g.position.set(shipGroup.position.x, shipGroup.position.y - 0.1, shipGroup.position.z - 3.2);
          scene.add(g); playerProjs.push({ mesh: g, vz: -spec.speed, vx: 0, dmg: spec.dmg, crit: spec.crit, splash: 11, pierce: false, trailColor: 0xff8c2b, spin: true, life: 1.8 });
          flashMuzzle(g.position, 0xff8c2b, 9.5); vibrate([18, 12, 22]);
          sfx.tone(240, 68, 0.24, 'sawtooth', 0.08);
        } else if (state.weapon === 'RAILGUN') {
          const g = new THREE.Group();
          g.add(
            new THREE.Mesh(railGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending })),
            new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 12.0, 10).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({ color: 0x3ef4ff, transparent: true, opacity: 0.62, blending: THREE.AdditiveBlending }))
          );
          g.position.set(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z - 6.0);
          scene.add(g); playerProjs.push({ mesh: g, vz: -spec.speed, vx: 0, dmg: spec.dmg, crit: spec.crit, splash: 0, pierce: true, trailColor: 0x82faff, life: 0.72 });
          spawnMachRings(shipGroup.position, 5, 0x7df9ff);
          flashMuzzle(new THREE.Vector3(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z - 3.5), 0x82faff, 13.0); vibrate([26, 14, 34]);
          state.shake = Math.min(1, state.shake + 0.36); sfx.tone(1100, 95, 0.24, 'sawtooth', 0.11);
        } else if (state.weapon === 'BURST') {
          [-2.4, -0.8, 0.8, 2.4].forEach(function (xo, idx) {
            const g = new THREE.Group();
            g.add(
              new THREE.Mesh(boltGeo, new THREE.MeshBasicMaterial({ color: 0xeafff5, blending: THREE.AdditiveBlending })),
              new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 3.2, 8).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({ color: spec.color, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending }))
            );
            g.position.set(shipGroup.position.x + xo, shipGroup.position.y - 0.15, shipGroup.position.z - 2.0 - idx*0.9);
            scene.add(g); playerProjs.push({ mesh: g, vz: -spec.speed, vx: xo*2.2, dmg: spec.dmg, crit: spec.crit, splash: 0, pierce: false, trailColor: 0x55ffb8, life: 1.1 });
          });
          flashMuzzle(new THREE.Vector3(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z - 2.4), 0x55ffb8, 7.0);
          sfx.tone(820, 260, 0.14, 'square', 0.06);
        }
      }

      function fireMissile(multi) {
        if (state.gameOver || state.victory || state.paused || state.missileAmmo <= 0) return;
        const count = multi ? Math.min(4, state.missileAmmo) : 1;
        const pool = enemies.map(function (e) { return { kind: 'enemy', obj: e }; });
        if (boss && !boss.dying) {
          boss.wps.forEach(function (w) { if (!w.destroyed) pool.push({ kind: 'wp', obj: w }); });
          if (pool.length === 0) pool.push({ kind: 'boss', obj: boss });
        }
        for (let i = 0; i < count; i++) {
          state.missileAmmo--;
          const m = new THREE.Mesh(new THREE.ConeGeometry(0.24, 1.5, 8), new THREE.MeshBasicMaterial({ color: 0xffb03a }));
          m.rotation.x = -Math.PI/2;
          m.position.set(shipGroup.position.x + (i-(count-1)/2)*1.4, shipGroup.position.y-0.4, shipGroup.position.z-1.5);
          scene.add(m);
          missiles.push({ mesh: m, lock: pool[i % Math.max(1, pool.length)] || null, vel: new THREE.Vector3((i-(count-1)/2)*14, 5, -70), life: 3.6 });
        }
        sfx.tone(360, 920, 0.26, 'sawtooth', 0.08); vibrate([20, 15, 25]);
      }

      function fireEMP() {
        if (state.gameOver || state.victory || state.paused || state.empCd > 0) return;
        state.empCd = 7.0 * getStats().cdMult;
        spawnShockwave(shipGroup.position.clone(), 48, 0x3ef4ff); vibrate([35, 20, 50]); sfx.tone(920, 60, 0.5, 'sine', 0.11);
        for (let i = enemies.length - 1; i >= 0; i--) {
          if (enemies[i].mesh.position.distanceTo(shipGroup.position) < 110) {
            if (damageEnemy(enemies[i], 42, 0.1, 3.0, true)) enemies.splice(i, 1);
          }
        }
        if (boss && !boss.dying) damageBoss(boss.root.position.clone(), 120, 0.1);
      }

      // Command Hub UI (Campaign / Hangar / Achievements)
      const hubOverlay = document.getElementById('hub-overlay');

      const hubWallet = document.getElementById('hub-wallet');

      function renderHub() {
        hubWallet.textContent = '信用點：' + saveData.credits.toLocaleString() + ' • 飛官等級 LV ' + saveData.level + '（經驗 ' + saveData.xp + '/' + (saveData.level*500) + '）• 最高分：' + saveData.highScore.toLocaleString();
        document.querySelectorAll('[data-hubtab]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-hubtab') === activeHubTab); });
        hubContent.innerHTML = '';

        if (activeHubTab === 'campaign') {

          const unlockBtn = document.createElement('button');

          unlockBtn.addEventListener('click', function () { saveData.unlockedSectors = 5; persistSave(); renderHub(); showToast('已解鎖全部五大星域'); vibrate(20); });
          topAct.appendChild(unlockBtn);
          hubContent.appendChild(topAct);

          const grid = document.createElement('div'); grid.className = 'hub-grid';
          SECTORS.forEach(function (sec, idx) {
            const unlocked = (idx + 1) <= saveData.unlockedSectors;

              '<div class="card-meta">通關獎勵：+' + sec.cr + ' 信用點 • +' + sec.xp + ' 經驗</div>';
            const btn = document.createElement('button');
            btn.className = unlocked ? 'hud-btn active' : 'hud-btn';
            btn.disabled = !unlocked;
            btn.textContent = unlocked ? (idx === currentSectorIdx ? '重新出擊此星域' : '出擊此星域') : '尚未解鎖';
            btn.addEventListener('click', function () { vibrate(18); deploySector(idx); });
            card.appendChild(btn);
            grid.appendChild(card);
          });
          hubContent.appendChild(grid);
        } else if (activeHubTab === 'hangar') {
          const grid = document.createElement('div'); grid.className = 'hub-grid';
          UPGRADE_DEFS.forEach(function (u) {
            const lvl = saveData.upgrades[u.key];
            const cost = lvl >= 5 ? null : UPGRADE_COSTS[lvl];
            const card = document.createElement('div'); card.className = 'card-item';
            card.innerHTML =
              '<div><div class="card-title">' + u.name + '（LV ' + lvl + '/5）</div>' +
              '<div class="card-sub">' + u.desc + '</div></div>' +
              '<div class="card-meta">' + (cost === null ? '已達最高等級' : '升級費用：' + cost + ' 信用點') + '</div>';
            const btn = document.createElement('button');
            btn.className = 'hud-btn active';
            btn.disabled = cost === null || saveData.credits < cost;

      const joyZone = document.getElementById('joy-zone'), joyKnob = document.getElementById('joy-knob');
      function updateStick(cx, cy) {
        const r = joyZone.getBoundingClientRect(), maxR = r.width*0.36;
        let dx = cx - (r.left + r.width/2), dy = cy - (r.top + r.height/2);
        const d = Math.hypot(dx, dy); if (d > maxR) { dx = dx/d*maxR; dy = dy/d*maxR; }
        joy.x = dx/maxR; joy.y = -dy/maxR; joyKnob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
      }
      joyZone.addEventListener('pointerdown', function (e) { joy.active=true; joy.id=e.pointerId; joyZone.setPointerCapture(e.pointerId); updateStick(e.clientX, e.clientY); });
      joyZone.addEventListener('pointermove', function (e) { if (joy.active && e.pointerId === joy.id) updateStick(e.clientX, e.clientY); });
      function resetStick() { joy.active=false; joy.id=null; joy.x=0; joy.y=0; joyKnob.style.transform='translate(0,0)'; }
      joyZone.addEventListener('pointerup', resetStick); joyZone.addEventListener('pointercancel', resetStick);

      function bindHold(id, setter) {
        const el = document.getElementById(id);
        el.addEventListener('pointerdown', function () { setter(true); el.classList.add('engaged'); vibrate(12); });
        el.addEventListener('pointerup', function () { setter(false); el.classList.remove('engaged'); });
        el.addEventListener('pointerleave', function () { setter(false); el.classList.remove('engaged'); });
      }
      bindHold('fire-btn', function (v) { touchFire = v; });
      bindHold('boost-btn', function (v) { touchBoost = v; });
      bindHold('shield-btn', function (v) { shieldActive = v; });

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
        camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const hullFill = document.getElementById('hull-fill'), hullVal = document.getElementById('hull-val');
      const shieldFill = document.getElementById('shield-fill'), shieldVal = document.getElementById('shield-val');
      const heatFill = document.getElementById('heat-fill'), heatVal = document.getElementById('heat-val');
      const boostFill = document.getElementById('boost-fill'), boostVal = document.getElementById('boost-val');
      const scoreVal = document.getElementById('score-val'), rewardRow = document.getElementById('reward-row');
      const bossFill = document.getElementById('boss-fill'), bossSub = document.getElementById('boss-sub');
      const missileCnt = document.getElementById('missile-cnt'), btnEmp = document.getElementById('btn-emp');
      const btnBomb = document.getElementById('btn-bomb'), btnUlt = document.getElementById('btn-ult'), ultPct = document.getElementById('ult-pct');
      const pilotLvPill = document.getElementById('pilot-lv-pill'), reticleEl = document.getElementById('reticle');

      let lastTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const nowSec = now * 0.001;

        if (state.paused) {
          renderer.render(scene, camera);
          return;
        }

        const st = getStats();
        let ix = joy.active ? joy.x : 0, iy = joy.active ? joy.y : 0;
        if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
        if (keys['KeyW'] || keys['ArrowUp']) iy += 1;
        if (keys['KeyS'] || keys['ArrowDown']) iy -= 1;
        ix = Math.max(-1, Math.min(1, ix)); iy = Math.max(-1, Math.min(1, iy));

        const isShieldHeld = shieldActive || !!keys['KeyV'];
        const wantBoost = touchBoost || !!keys['ShiftLeft'] || !!keys['ShiftRight'];
        const boosting = !state.gameOver && !state.victory && wantBoost && state.boost > 4;

        if (boosting) state.boost = Math.max(0, state.boost - dt * 32);
        else state.boost = Math.min(100, state.boost + dt * 20 * st.spdMult);

        if (isShieldHeld && state.shield > 0 && !state.gameOver) state.shield = Math.max(0, state.shield - dt * 14);
        else if (!state.gameOver) state.shield = Math.min(state.maxShield, state.shield + dt * 9 * (1 + (saveData.upgrades.shield-1)*0.18));

        shieldUniforms.uTime.value += dt;
        shieldUniforms.uOpacity.value += (((isShieldHeld && state.shield > 1) ? 0.92 : shieldUniforms.uImpact.value * 0.85) - shieldUniforms.uOpacity.value) * Math.min(1, dt * 10);
        shieldUniforms.uImpact.value = Math.max(0, shieldUniforms.uImpact.value - dt * 3.0);
        shieldDome.visible = shieldUniforms.uOpacity.value > 0.02;

        state.primaryCd = Math.max(0, state.primaryCd - dt);
        state.empCd = Math.max(0, state.empCd - dt);
        state.bombCd = Math.max(0, state.bombCd - dt);
        state.heat = Math.max(0, state.heat - (state.overheated ? 26 : 34) * st.coolMult * dt);
        if (state.overheated && state.heat <= 18) state.overheated = false;
        if (state.comboTimer > 0) { state.comboTimer -= dt; if (state.comboTimer <= 0) state.combo = 1.0; }

        if (!state.gameOver && !state.victory) {
          const maxSpd = (boosting ? 28 : 20) * st.spdMult;
          shipVel.x += (ix * maxSpd - shipVel.x) * Math.min(1, dt * 8.5);
          shipVel.y += (iy * maxSpd * 0.78 - shipVel.y) * Math.min(1, dt * 8.5);
          shipGroup.position.x = Math.max(-15, Math.min(15, shipGroup.position.x + shipVel.x * dt));
          shipGroup.position.y = Math.max(-8.5, Math.min(8.5, shipGroup.position.y + shipVel.y * dt));
          shipGroup.rotation.z += (-ix * 0.62 - shipGroup.rotation.z) * Math.min(1, dt * 9);
          shipGroup.rotation.x += (iy * 0.32 - shipGroup.rotation.x) * Math.min(1, dt * 9);
          if (touchFire || keys['Space']) firePrimary(dt); else photonBeamMesh.visible = false;
        } else { photonBeamMesh.visible = false; }

        if (state.novaTimer > 0) {
          state.novaTimer -= dt; novaMesh.visible = true;
          novaMesh.position.set(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z - 122);
          novaMesh.rotation.z += dt * 8;
          for (let i = enemies.length - 1; i >= 0; i--) {
            if (Math.hypot(enemies[i].mesh.position.x - shipGroup.position.x, enemies[i].mesh.position.y - shipGroup.position.y) < 12) {
              if (damageEnemy(enemies[i], 340*dt, 0.4, 2.0)) enemies.splice(i, 1);
            }
          }
          if (boss && !boss.dying && Math.hypot(boss.root.position.x - shipGroup.position.x, boss.root.position.y - shipGroup.position.y) < 18) {
            damageBoss(boss.root.position.clone(), 280*dt, 0.35);
          }
        } else { novaMesh.visible = false; }

        const pulse = 0.88 + Math.sin(now * 0.03) * 0.12;
        thrusterLight.intensity = (boosting ? 6.5 : 3.6) * pulse;
        thrusterCones.forEach(function (c, idx) {
          c.scale.set(1, (boosting ? 1.85 : 1.0)*pulse, 1);
          if (idx % 2 === 0) c.material.color.setHex(boosting ? 0xbef9ff : 0x2ce8ff);
        });

        // Wave Spawner
        if (!state.gameOver && !state.victory && !boss) {
          if (state.waveQueue.length > 0) {
            state.spawnDelay -= dt;
            if (state.spawnDelay <= 0 && enemies.length < 6) {
              const nextType = state.waveQueue.shift();
              spawnEnemy(nextType, (Math.random()-0.5)*24, (Math.random()-0.5)*11, -175 - Math.random()*30);
              state.spawnDelay = 1.0;
            }
          } else if (enemies.length === 0 && state.waveIdx < 4) {
            startWave(state.waveIdx + 1);
          }
        }

        // Enemies Update
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i], p = e.mesh.position;
          if (e.stunTimer > 0) { e.stunTimer -= dt; }
          else {
            if (e.type === 'SCOUT') { p.z += e.spec.spd*dt; p.x = e.anchorX + Math.sin(nowSec*3.1+e.phase)*8.5; p.y = e.anchorY + Math.cos(nowSec*2.3+e.phase)*3.2; }
            else if (e.type === 'INTERCEPTOR') { p.z = Math.min(-34, p.z + e.spec.spd*dt); p.x += (shipGroup.position.x + Math.sin(nowSec*1.9+e.phase)*10 - p.x)*Math.min(1,dt*2.4); p.y += (shipGroup.position.y - p.y)*Math.min(1,dt*1.6); }
            else if (e.type === 'DESTROYER') { if (p.z < -68) p.z += e.spec.spd*dt; p.x = e.anchorX + Math.sin(nowSec*0.65+e.phase)*3.8; }
            else if (e.type === 'BOMBER') { if (p.z < -96) p.z += e.spec.spd*dt; p.x = e.anchorX + Math.sin(nowSec*1.1+e.phase)*6.0; }
            else {
              if (p.z < -56) p.z += e.spec.spd*dt;
              e.dashCd -= dt;
              if (e.dashCd <= 0) { e.dashCd = 3.0; e.anchorX = (Math.random()-0.5)*24; e.anchorY = (Math.random()-0.5)*10; spawnShockwave(p.clone(), 4.5, 0xff33aa); }
              p.x += (e.anchorX - p.x)*Math.min(1,dt*5.8); p.y += (e.anchorY - p.y)*Math.min(1,dt*5.8);
              if (e.shield < e.maxShield) e.shield = Math.min(e.maxShield, e.shield + dt*6);
            }
            e.fireCd -= dt;
            if (e.fireCd <= 0 && p.z < -18 && p.z > -160) {
              e.fireCd = e.spec.fcd;
              const toP = shipGroup.position.clone().sub(p).normalize();
              if (e.type === 'DESTROYER') {
                [-0.22,-0.11,0,0.11,0.22].forEach(function (ang) {
                  const s = new THREE.Mesh(new THREE.SphereGeometry(0.38,8,6), new THREE.MeshBasicMaterial({ color: 0xff6b2b }));
                  s.position.copy(p); scene.add(s); enemyShots.push({ mesh: s, vel: toP.clone().applyAxisAngle(new THREE.Vector3(0,1,0),ang).multiplyScalar(62), dmg: 15, homing: false, life: 3.4 });
                });
              } else if (e.type === 'BOMBER') {
                const s = new THREE.Mesh(new THREE.SphereGeometry(0.55,10,8), new THREE.MeshBasicMaterial({ color: 0xffaa2b }));
                s.position.copy(p); scene.add(s); enemyShots.push({ mesh: s, vel: toP.multiplyScalar(42), dmg: 24, homing: true, life: 4.5 });
              } else if (e.type === 'ELITE') {
                [-0.14,0,0.14].forEach(function (ang) {
                  const s = new THREE.Mesh(new THREE.SphereGeometry(0.32,8,6), new THREE.MeshBasicMaterial({ color: 0xff33aa }));
                  s.position.copy(p); scene.add(s); enemyShots.push({ mesh: s, vel: toP.clone().applyAxisAngle(new THREE.Vector3(0,1,0),ang).multiplyScalar(80), dmg: 14, homing: false, life: 3.0 });
                });
              } else {
                const s = new THREE.Mesh(new THREE.SphereGeometry(0.3,8,6), new THREE.MeshBasicMaterial({ color: 0xff3b4e }));
                s.position.copy(p); scene.add(s); enemyShots.push({ mesh: s, vel: toP.multiplyScalar(70), dmg: 11, homing: false, life: 3.0 });
              }
            }
          }
          if (p.z > 18) { scene.remove(e.mesh); e.el.remove(); enemies.splice(i, 1); continue; }
          const pr = p.clone().project(camera);
          if (pr.z < 1) {
            e.el.style.display = 'block';
            e.el.style.left = ((pr.x*0.5+0.5)*window.innerWidth)+'px'; e.el.style.top = ((-pr.y*0.5+0.5)*window.innerHeight)+'px';
            e.el.querySelector('.lock-hp-fill').style.width = Math.max(0,(e.hp/e.maxHp)*100)+'%';
            e.el.classList.toggle('stunned', e.stunTimer > 0);
          } else { e.el.style.display = 'none'; }
        }

        // Boss Update
        if (boss) {
          if (boss.spinRing) boss.spinRing.rotation.z += dt * 0.65;
          if (boss.dying) {
            boss.deathTimer -= dt; boss.deathPulseCd -= dt;
            if (boss.deathPulseCd <= 0) {
              boss.deathPulseCd = 0.25;
              const off = new THREE.Vector3((Math.random()-0.5)*18, (Math.random()-0.5)*10, (Math.random()-0.5)*26);
              spawnExplosion(boss.root.position.clone().add(off), 2.3, boss.coreHex);
              state.shake = Math.min(1, state.shake + 0.4);
            }
            if (boss.deathTimer <= 0) {
              const sec = SECTORS[currentSectorIdx];
              spawnExplosion(boss.root.position.clone(), 4.4, 0xffb03a);
              spawnShockwave(boss.root.position.clone(), 88, 0x2ce8ff);
              state.score += 10000;
              saveData.credits += sec.cr;
              saveData.bossesDefeated++;
              if (saveData.unlockedSectors < Math.min(5, currentSectorIdx + 2)) saveData.unlockedSectors = Math.min(5, currentSectorIdx + 2);
              if (state.score > saveData.highScore) saveData.highScore = state.score;
              checkProgression(sec.xp);
              clearBossUI(); state.victory = true;
              document.getElementById('end-title').textContent = sec.code + ' 肅清完成 — 已擊毀 ' + sec.boss;
              document.getElementById('end-title').style.color = '#2ce8ff';
              document.getElementById('end-stats').textContent = '總分 ' + state.score.toLocaleString() + ' • +' + sec.cr + ' 信用點 • +' + sec.xp + ' 經驗';
              document.getElementById('next-sector-btn').style.display = currentSectorIdx < 4 ? 'inline-block' : 'none';
              document.getElementById('end-overlay').classList.add('open');
            }
          } else {
            if (boss.introTimer > 0) {
              boss.introTimer -= dt;
              boss.root.position.z += (-72 - boss.root.position.z) * Math.min(1, dt * 2.2);
            } else {
              boss.root.position.x = Math.sin(nowSec * (boss.phase === 3 ? 0.72 : 0.45)) * 10.5;
              boss.root.position.y = 3.2 + Math.cos(nowSec * 0.55) * 2.6;
              boss.fireCd -= dt;
              if (boss.fireCd <= 0) {
                boss.fireCd = boss.phase === 3 ? 0.95 : (boss.phase === 2 ? 1.35 : 1.75);
                const toP = shipGroup.position.clone().sub(boss.root.position).normalize();
                const spreads = boss.phase === 1 ? [-0.14, 0, 0.14] : [-0.26, -0.13, 0, 0.13, 0.26];
                spreads.forEach(function (ang) {
                  const s = new THREE.Mesh(new THREE.SphereGeometry(0.46, 8, 6), new THREE.MeshBasicMaterial({ color: boss.coreHex }));
                  s.position.set(boss.root.position.x, boss.root.position.y + 4.8, boss.root.position.z + 12);
                  scene.add(s); enemyShots.push({ mesh: s, vel: toP.clone().applyAxisAngle(new THREE.Vector3(0,1,0), ang).multiplyScalar(68), dmg: 15, homing: false, life: 3.4 });
                });
              }
              boss.reinforceCd -= dt;
              if (boss.reinforceCd <= 0 && enemies.length < 3) {
                boss.reinforceCd = 11.0;
                spawnEnemy('SCOUT', boss.root.position.x - 14, 3, boss.root.position.z - 10);
                spawnEnemy('SCOUT', boss.root.position.x + 14, -3, boss.root.position.z - 10);
              }
              if (boss.phase >= 2) {
                boss.beamTimer -= dt;
                if (boss.beamState === 'IDLE' && boss.beamTimer <= 0) {
                  boss.beamState = 'CHARGING'; boss.beamTimer = 1.6;
                  showBanner('警告！主砲能量光束充能中 — 立即閃避！', 1500); sfx.tone(120, 620, 1.4, 'sawtooth', 0.1);
                } else if (boss.beamState === 'CHARGING') {
                  boss.emitter.scale.setScalar(1 + Math.sin(now * 0.04)*0.35);
                  if (boss.beamTimer <= 0) { boss.beamState = 'FIRING'; boss.beamTimer = 1.45; boss.emitter.scale.setScalar(1); state.shake = Math.min(1, state.shake + 0.45); }
                } else if (boss.beamState === 'FIRING') {
                  bossBeamMesh.visible = true;
                  bossBeamMesh.material.color.setHex(boss.coreHex);
                  bossBeamMesh.position.set(boss.root.position.x, boss.root.position.y - 4.0, boss.root.position.z + 112);
                  if (Math.hypot(shipGroup.position.x - boss.root.position.x, shipGroup.position.y - (boss.root.position.y - 4.0)) < 4.6) damagePlayer(45 * dt);
                  if (boss.beamTimer <= 0) { boss.beamState = 'IDLE'; boss.beamTimer = boss.phase === 3 ? 3.8 : 5.5; bossBeamMesh.visible = false; }
                }
              }
            }
            let aliveCores = 0;
            boss.wps.forEach(function (w) {
              if (w.destroyed) return;
              aliveCores++;
              const wpWorld = new THREE.Vector3(); w.mesh.getWorldPosition(wpWorld);
              const pr = wpWorld.project(camera);
              if (pr.z < 1) {
                w.el.style.display = 'block';
                w.el.style.left = ((pr.x*0.5+0.5)*window.innerWidth)+'px'; w.el.style.top = ((-pr.y*0.5+0.5)*window.innerHeight)+'px';
                w.el.querySelector('.lock-hp-fill').style.width = Math.max(0,(w.hp/w.maxHp)*100)+'%';
              } else { w.el.style.display = 'none'; }
            });
            bossFill.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
            bossSub.textContent = '階段 ' + boss.phase + '/3 • 剩餘 ' + aliveCores + ' 座反應爐核心';
          }
        }

        // Projectiles, Missiles, Bombs, Enemy Shots, Pickups
        for (let i = playerProjs.length - 1; i >= 0; i--) {
          const p = playerProjs[i]; p.mesh.position.x += p.vx*dt; p.mesh.position.z += p.vz*dt; p.life -= dt;
          if (p.spin) { p.mesh.rotation.x += dt * 7; p.mesh.rotation.y += dt * 5; spawnTrailOrb(p.mesh.position, p.trailColor, 1.3); }
          let rm = p.life <= 0;
          for (let j = enemies.length - 1; j >= 0; j--) {
            if (p.mesh.position.distanceTo(enemies[j].mesh.position) < enemies[j].spec.r + 1.1) {
              if (p.splash > 0) {
                spawnExplosion(p.mesh.position, 0.85, 0xff8c2b);
                for (let k = enemies.length - 1; k >= 0; k--) {
                  if (enemies[k].mesh.position.distanceTo(p.mesh.position) < p.splash) {
                    if (damageEnemy(enemies[k], p.dmg, p.crit, 1.0)) enemies.splice(k, 1);
                  }
                }
              } else { if (damageEnemy(enemies[j], p.dmg, p.crit, 1.0)) enemies.splice(j, 1); }
              if (!p.pierce) { rm = true; break; }
            }
          }
          if (!rm && boss && !boss.dying && p.mesh.position.distanceTo(boss.root.position) < 20) {
            damageBoss(p.mesh.position.clone(), p.dmg, p.crit); if (!p.pierce) rm = true;
          }
          if (rm) { scene.remove(p.mesh); playerProjs.splice(i, 1); }
        }

        for (let i = missiles.length - 1; i >= 0; i--) {
          const ms = missiles[i]; ms.life -= dt; let tPos = null;
          if (ms.lock) {
            if (ms.lock.kind === 'enemy' && ms.lock.obj.hp > 0) tPos = ms.lock.obj.mesh.position;
            else if (ms.lock.kind === 'wp' && !ms.lock.obj.destroyed) { tPos = new THREE.Vector3(); ms.lock.obj.mesh.getWorldPosition(tPos); }
            else if (ms.lock.kind === 'boss' && boss && !boss.dying) tPos = boss.root.position;
          }
          if (tPos) ms.vel.lerp(tPos.clone().sub(ms.mesh.position).normalize().multiplyScalar(120), Math.min(1, dt*6.5));
          ms.mesh.position.addScaledVector(ms.vel, dt); ms.mesh.lookAt(ms.mesh.position.clone().add(ms.vel));
          spawnTrailOrb(ms.mesh.position, 0xff9d2e, 1.15);
          let hit = ms.life <= 0;
          for (let j = enemies.length - 1; j >= 0; j--) {
            if (ms.mesh.position.distanceTo(enemies[j].mesh.position) < enemies[j].spec.r + 1.6) {
              spawnExplosion(ms.mesh.position, 1.1, 0xffb03a);
              if (damageEnemy(enemies[j], 105, 0.25, 1.2)) enemies.splice(j, 1); hit = true; break;
            }
          }
          if (!hit && boss && !boss.dying && ms.mesh.position.distanceTo(boss.root.position) < 20) {
            spawnExplosion(ms.mesh.position, 1.2, 0xffb03a); damageBoss(ms.mesh.position.clone(), 130, 0.25); hit = true;
          }
          if (hit) { scene.remove(ms.mesh); missiles.splice(i, 1); }
        }

        for (let i = eBombs.length - 1; i >= 0; i--) {
          const b = eBombs[i]; b.mesh.position.z -= 48*dt; b.mesh.rotation.y += dt*4; b.life -= dt;
          enemies.forEach(function (e) { if (e.mesh.position.distanceTo(b.mesh.position) < 34) e.mesh.position.lerp(b.mesh.position, dt*2.2); });
          if (b.life <= 0) {
            spawnExplosion(b.mesh.position, 2.3, 0xb678ff); spawnShockwave(b.mesh.position, 32, 0xb678ff); state.shake = Math.min(1, state.shake + 0.5);
            for (let j = enemies.length - 1; j >= 0; j--) { if (enemies[j].mesh.position.distanceTo(b.mesh.position) < 36) { if (damageEnemy(enemies[j], 210, 0.3, 1.4)) enemies.splice(j, 1); } }
            if (boss && !boss.dying && boss.root.position.distanceTo(b.mesh.position) < 46) damageBoss(b.mesh.position.clone(), 280, 0.3);
            scene.remove(b.mesh); eBombs.splice(i, 1);
          }
        }

        for (let i = enemyShots.length - 1; i >= 0; i--) {
          const es = enemyShots[i]; es.life -= dt;
          if (es.homing && !state.gameOver) es.vel.lerp(shipGroup.position.clone().sub(es.mesh.position).normalize().multiplyScalar(48), Math.min(1, dt*2.2));
          es.mesh.position.addScaledVector(es.vel, dt);
          if (!state.gameOver && es.mesh.position.distanceTo(shipGroup.position) < 2.6) { damagePlayer(es.dmg); scene.remove(es.mesh); enemyShots.splice(i, 1); continue; }
          if (es.life <= 0) { scene.remove(es.mesh); enemyShots.splice(i, 1); }
        }

        for (let i = pickups.length - 1; i >= 0; i--) {
          const pk = pickups[i]; pk.life -= dt; pk.mesh.rotation.y += dt*3; pk.mesh.position.z += 24*dt;
          if (pk.mesh.position.distanceTo(shipGroup.position) < 18) pk.mesh.position.lerp(shipGroup.position, dt*7.5);
          if (pk.mesh.position.distanceTo(shipGroup.position) < 3.0) {
            saveData.credits += pk.cr; checkProgression(pk.xp);
            state.hull = Math.min(state.maxHull, state.hull + 5);
            if (state.missileAmmo < st.maxMissiles) state.missileAmmo++;
            showPop(shipGroup.position, '+' + pk.cr + ' 信用點', '#4effa8'); vibrate(14); sfx.tone(580, 960, 0.12, 'sine', 0.06);
            scene.remove(pk.mesh); pickups.splice(i, 1); continue;
          }
          if (pk.life <= 0 || pk.mesh.position.z > 20) { scene.remove(pk.mesh); pickups.splice(i, 1); }
        }

        // Muzzle Flash, Weapon Trails, Mach Rings & Boost Vignette
        boostVignette.style.opacity = boosting ? '1' : '0';
        if (muzzleTimer > 0) { muzzleTimer -= dt; muzzleLight.intensity = Math.max(0, muzzleLight.intensity * (1 - dt * 15)); }
        else { muzzleLight.intensity = 0; }
        for (let i = vfxTrails.length - 1; i >= 0; i--) {
          const tr = vfxTrails[i]; tr.age += dt; const t = tr.age / tr.maxAge;
          if (t >= 1) { scene.remove(tr.mesh); vfxTrails.splice(i, 1); continue; }
          tr.mesh.scale.setScalar(tr.mesh.scale.x + dt * (tr.grow || 1.4));
          tr.mesh.material.opacity = Math.max(0, (1 - t) * 0.85);
        }
        // VFX & Environment Motion
        for (let i = explosions.length - 1; i >= 0; i--) {
          const ex = explosions[i]; ex.age += dt; const t = ex.age / ex.dur;
          if (t >= 1) { scene.remove(ex.g); explosions.splice(i, 1); continue; }
          ex.core.scale.setScalar(1 + t*2.2); ex.core.material.opacity = Math.max(0, 1 - t*1.6);
          ex.ring.scale.setScalar(1 + t*5.8); ex.ring.material.opacity = Math.max(0, 1 - t);
          const attr = ex.sparks.geometry.attributes.position;
          for (let j = 0; j < attr.count; j++) attr.setXYZ(j, attr.getX(j)+ex.vArr[j*3]*dt, attr.getY(j)+ex.vArr[j*3+1]*dt, attr.getZ(j)+ex.vArr[j*3+2]*dt);
          attr.needsUpdate = true; ex.sparks.material.opacity = Math.max(0, 1 - t);
        }
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i]; sw.age += dt; const t = sw.age / sw.dur;
          if (t >= 1) { scene.remove(sw.mesh); shockwaves.splice(i, 1); continue; }
          sw.mesh.scale.setScalar(1 + t*sw.maxScale); sw.mesh.material.opacity = (1 - t)*0.7;
        }
        for (let i = critPops.length - 1; i >= 0; i--) {
          const cp = critPops[i]; cp.age += dt;
          cp.el.style.opacity = String(Math.max(0, 1 - cp.age/0.75));
          cp.el.style.transform = 'translate(-50%, calc(-50% - ' + (cp.age*38).toFixed(0) + 'px))';
          if (cp.age >= 0.75) { cp.el.remove(); critPops.splice(i, 1); }
        }

        const speedMult = boosting ? 2.4 : 1.0;
        nebulaUniforms.forEach(function (u) { u.uTime.value += dt; });
        portalUniforms.forEach(function (u) { u.uTime.value += dt; });
        if (landmarkGroup) {
          if (SECTORS[currentSectorIdx].landmark === 'TITANGATE') landmarkGroup.rotation.z += dt * 0.08;
          else landmarkGroup.rotation.y += dt * 0.012;
        }
        const fwd = 42 * speedMult * dt;
        if (asteroidMesh) {
          for (let i = 0; i < asteroidData.length; i++) {
            const a = asteroidData[i]; a.pos.z += fwd; if (a.pos.z > 32) a.pos.z = -420;
            a.rot.x += a.spin.x*dt; a.rot.y += a.spin.y*dt;
            dummy.position.copy(a.pos); dummy.rotation.copy(a.rot); dummy.scale.setScalar(a.scale); dummy.updateMatrix();
            asteroidMesh.setMatrixAt(i, dummy.matrix);
          }
          asteroidMesh.instanceMatrix.needsUpdate = true;
        }
        if (dustPoints) {
          const attr = dustPoints.geometry.attributes.position;
          for (let i = 0; i < attr.count; i++) { let z = attr.getZ(i) + fwd*2.4; if (z > 24) z = -160; attr.setZ(i, z); }
          attr.needsUpdate = true;
        }

        // Update Multi-Depth Capital Carriers & Near-Field Obstacle Collision Avoidance
        for (let i = 0; i < bgCarriers.length; i++) {
          const c = bgCarriers[i];
          c.group.position.z += c.speed * (c.obstacle ? (boosting ? 1.65 : 1.0) : 1.0) * dt;
          if (c.strobe) c.strobe.visible = Math.sin(nowSec * 5.2 + i * 2.1) > 0.25;
          if (c.obstacle) {
            if (c.group.position.z > 58) {
              c.group.position.z = -310 - Math.random() * 60;
              c.group.position.x = (c.baseX < 0 ? -1 : 1) * (10 + Math.random() * 8);
              c.group.position.y = (Math.random() - 0.5) * 11;
            }
            c.warnCd = Math.max(0, c.warnCd - dt);
            // Check player proximity / collision with massive carrier hull
            if (!state.gameOver && !state.victory &&
                Math.abs(shipGroup.position.x - c.group.position.x) < c.hitX &&
                Math.abs(shipGroup.position.y - c.group.position.y) < c.hitY &&
                Math.abs(shipGroup.position.z - c.group.position.z) < c.hitZ) {
              if (c.warnCd <= 0) {
                c.warnCd = 0.65;
                damagePlayer(18);
                showBanner('近距碰撞警告！請閃避大型母艦艦體！', 1400);
                // Gentle push-out deflection so player never gets trapped inside hull
                shipGroup.position.x += (shipGroup.position.x >= c.group.position.x ? 3.5 : -3.5);
              }
            }
          } else {
            if (c.group.position.z > 90) c.group.position.z = -420;
          }
        }

        // Camera
        const mode = camModes[camIdx], bossActive = !!(boss && !boss.dying);
        const desiredFov = boosting ? 70 : (bossActive ? 63 : (mode === 'WIDE' ? 66 : 58));
        camera.fov += (desiredFov - camera.fov) * Math.min(1, dt * 5); camera.updateProjectionMatrix();
        if (mode === 'ORBIT') {
          orbitAngle += dt * 0.42;
          targetCamPos.set(shipGroup.position.x + Math.sin(orbitAngle)*14, shipGroup.position.y + 4.2, shipGroup.position.z + Math.cos(orbitAngle)*14);
          camera.position.lerp(targetCamPos, Math.min(1, dt * 5)); camera.lookAt(shipGroup.position);
        } else {
          const zOff = bossActive ? 15.5 : (mode === 'WIDE' ? 17.5 : 13.0), yOff = bossActive ? 4.8 : (mode === 'WIDE' ? 5.6 : 4.1);
          targetCamPos.set(shipGroup.position.x * 0.72, shipGroup.position.y * 0.72 + yOff, shipGroup.position.z + zOff);
          camera.position.lerp(targetCamPos, Math.min(1, dt * 6));
          const sh = state.shake + (boosting ? 0.1 : 0);
          if (sh > 0.01) { camera.position.x += (Math.random()-0.5)*sh*0.65; camera.position.y += (Math.random()-0.5)*sh*0.65; }
          state.shake = Math.max(0, state.shake - dt * 2.4);
          lookTarget.set(shipGroup.position.x * 0.45, shipGroup.position.y * 0.45 + 0.6, shipGroup.position.z - 36);
          camera.lookAt(lookTarget);
          camera.rotation.z += (-ix * 0.08 - camera.rotation.z) * Math.min(1, dt * 5);
        }
        reticleEl.style.transform = 'translate(calc(-50% + ' + (ix*18).toFixed(1) + 'px), calc(-50% + ' + (-iy*12).toFixed(1) + 'px))';

        // HUD Sync
        pilotLvPill.textContent = 'LV ' + saveData.level;
        hullFill.style.width = Math.max(0, (state.hull/state.maxHull)*100).toFixed(0)+'%'; hullVal.textContent = Math.round(state.hull);
        shieldFill.style.width = Math.max(0, (state.shield/state.maxShield)*100).toFixed(0)+'%'; shieldVal.textContent = Math.round(state.shield);
        heatFill.style.width = state.heat.toFixed(0)+'%'; heatVal.textContent = Math.round(state.heat)+'%';
        boostFill.style.width = state.boost.toFixed(0)+'%'; boostVal.textContent = Math.round(state.boost)+'%';
        scoreVal.textContent = String(state.score).padStart(6, '0');
        rewardRow.textContent = '信用點 ' + saveData.credits.toLocaleString() + ' • 連擊 x' + state.combo.toFixed(1);
        missileCnt.textContent = String(state.missileAmmo);
        btnEmp.disabled = state.empCd > 0; btnEmp.textContent = state.empCd > 0 ? '電磁 ' + Math.ceil(state.empCd) + 's' : '電磁';
        btnBomb.disabled = state.bombCd > 0; btnBomb.textContent = state.bombCd > 0 ? '重力 ' + Math.ceil(state.bombCd) + 's' : '重力';
        ultPct.textContent = Math.floor(state.ult) + '%';
        btnUlt.classList.toggle('ready', state.ult >= 100); btnUlt.disabled = state.ult < 100;

        renderer.render(scene, camera);
      }

      window.onload = function () {
        applyTier(currentTier);
        deploySector(0);
        lastTime = performance.now();
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>
